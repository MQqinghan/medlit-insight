<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #f0f6ff 0%, #e8f0fe 50%, #f5f0ff 100%);
    height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card { text-align: center; padding: 60px; }
  .logo {
    width: 88px; height: 88px; border-radius: 22px; margin: 0 auto 28px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: #fff; font-size: 42px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 32px rgba(59,130,246,.35);
  }
  h1 { font-size: 52px; color: #1e293b; letter-spacing: 2px; margin-bottom: 18px; }
  .sub { font-size: 24px; color: #475569; margin-bottom: 40px; }
  .tags { display: flex; gap: 14px; justify-content: center; }
  .tag {
    background: #fff; border: 1px solid #dbeafe; color: #3b82f6;
    padding: 8px 22px; border-radius: 999px; font-size: 17px;
    box-shadow: 0 2px 8px rgba(30,41,59,.06);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">文</div>
    <h1>文 献 罗 盘</h1>
    <p class="sub">PubMed 文献洞察 · 输入一个研究方向，三十秒看清这个领域</p>
    <div class="tags">
      <span class="tag">Python · FastAPI</span>
      <span class="tag">Vue3 · ECharts</span>
      <span class="tag">PubMed E-utilities</span>
      <span class="tag">通义千问</span>
    </div>
  </div>
</body>
</html>
